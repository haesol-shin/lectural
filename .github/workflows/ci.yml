name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pytest --with numpy pytest -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff@0.17.2 check .
      - run: uvx ruff@0.17.2 format --check .

  url-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          uv run --with pytest --with numpy --with 'yt-dlp==2026.8.19' python -c \
            "import shutil, yt_dlp; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
          uv run --with pytest --with numpy --with 'yt-dlp==2026.8.19' pytest -q -m url_runtime
        env:
          LECTURAL_REQUIRE_URL_RUNTIME: "1"

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Pinned deliberately: the validator is a release gate, so bump this
      # version on purpose rather than tracking a moving latest.
      - run: npm install -g @anthropic-ai/claude-code@2.1.177
      - run: claude plugin validate .
