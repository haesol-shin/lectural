name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          pyproject_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' lectural/__init__.py)"
          status=0
          for pair in "plugin.json:$plugin_version" "pyproject.toml:$pyproject_version" "lectural/__init__.py:$module_version"; do
            if [ "$tag_version" != "${pair#*:}" ]; then
              echo "Tag version $tag_version does not match ${pair%%:*} version ${pair#*:}" >&2
              status=1
            fi
          done
          exit "$status"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          venv="$RUNNER_TEMP/lectural-release-venv"
          uv venv --clear "$venv"
          uv pip install --python "$venv/bin/python" --no-deps dist/*.whl
          output="$("$venv/bin/lectural" --version --json)"
          printf '%s\n' "$output"
          reported_version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "$output")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$reported_version" != "$tag_version" ]]; then
            echo "Wheel version $reported_version does not match tag version $tag_version" >&2
            exit 1
          fi

      - name: Upload distributions for release
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog_notes.py "$version" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for [$version]; add one before tagging." >&2
            exit 1
          fi
          # The CHANGELOG link reference is the authoritative compare/tag URL.
          link="$(python3 scripts/changelog_notes.py "$version" --link)"
          {
            echo ""
            if [ -n "$link" ]; then
              echo "**Full changelog**: $link"
            else
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } >> release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build, release]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
