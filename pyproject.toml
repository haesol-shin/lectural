[project]
name = "lectural"
version = "0.3.0"
description = "Turn a YouTube video, local video, or local audio file into deterministic evidence for video-based work: every utterance, every on-screen text, every scene."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Heavy runtime deps are imported lazily inside functions so the package
# imports and unit-tests run offline without these installed.
dependencies = []

[project.urls]
Homepage = "https://github.com/haesol-shin/lectural"
Repository = "https://github.com/haesol-shin/lectural"
Changelog = "https://github.com/haesol-shin/lectural/blob/main/CHANGELOG.md"
Issues = "https://github.com/haesol-shin/lectural/issues"

[project.optional-dependencies]
# Install with: pip install "lectural[run]"
run = [
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.2",
    "faster-whisper>=1.0.0",
    "opencv-python==4.6.0.66",
    "opencv-contrib-python==4.6.0.66",
    "opencv-python-headless==4.6.0.66",
    "numpy>=1.24,<2",
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "webrtcvad>=2.0.10",
    # webrtcvad imports pkg_resources at runtime on current wheels.
    "setuptools>=68,<81",
    "psutil>=5.9",
]
test = ["pytest>=7.0", "numpy>=1.24"]
# Calibration uses the exact overlapping provider set resolved by `[run]`.
# OpenCV packages share the `cv2` namespace, so every provider and version is
# pinned and provenance-checked before a worker may discard a frame.
alignment = [
    "opencv-python==4.6.0.66",
    "opencv-contrib-python==4.6.0.66",
    "opencv-python-headless==4.6.0.66",
    "numpy>=1.24,<2",
    "Pillow>=10.0.0",
]
# Dev/maintainer-only: Issue #21 evidence-quality/resource benchmark
# (scripts/benchmark.py). The psutil dependency is also part of `[run]` for
# optional extraction process-tree resource measurements.
bench = [
    "jiwer>=3.0",
    "whisper-normalizer>=0.1",
    "Levenshtein>=0.20",
    "psutil>=5.9",
]
# Keep the remaining transitive runtime dependencies inside the approved
# compatibility matrix.
[tool.uv]
constraint-dependencies = [
    "onnxruntime<1.24",
]

[project.scripts]
lectural = "lectural.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lectural*"]
exclude = ["lectural_bench*"]

[tool.pytest.ini_options]
markers = [
    "smoke: requires external binaries/models or network (ffmpeg, yt-dlp, faster-whisper, paddleocr); skipped by default",
]
addopts = "-m 'not smoke'"
